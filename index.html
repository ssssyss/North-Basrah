  <script>
    // يمكنك تغيير اسم المستخدم وكلمة المرور هنا
    const correctUsername = "ubnt";
    const correctPassword = "ubnt10";

    const loginOverlay = document.getElementById('login-overlay');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('login-error');

    loginForm.addEventListener('submit', function(event) {
      event.preventDefault(); // منع الإرسال الافتراضي للنموذج

      const enteredUsername = usernameInput.value;
      const enteredPassword = passwordInput.value;

      if (enteredUsername === correctUsername && enteredPassword === correctPassword) {
        console.log("تم تسجيل الدخول بنجاح!");
        loginOverlay.style.display = 'none'; // إخفاء نموذج تسجيل الدخول
        loginError.style.display = 'none';
      } else {
        loginError.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة. الرجاء المحاولة مرة أخرى.";
        loginError.style.display = 'block';
      }
    });
  </script>
