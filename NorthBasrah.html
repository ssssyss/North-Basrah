
    <style>

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* لمنع ظهور أشرطة التمرير غير المرغوب فيها في الصفحة الرئيسية */
            
        }
        #content-info{
            width: auto;
            margin: 0 auto;
            text-align: center;
        }
        #author-info{
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        #title{
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            padding-top: 10px;
            margin-bottom: 2px;
            font-size: 34px;
            color: #505050;
        }
        .text{
            white-space:nowrap;
            text-overflow: ellipsis;
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 2px;
            font-size: 20px;
            color: #8c8c8c;
        }
        #navBar{
            width: auto;
            height: auto;
            position: fixed;
            right:0;
            bottom: 0;
            background-color: #f0f3f4;
            overflow-y: auto;
            text-align: center;
        }
        #svg-container{
            width: 100%;
            overflow-x: scroll;
            width: 100%; /* التأكد من أنها تأخذ العرض الكامل */
            height: 100%; /* التأكد من أنها تأخذ الارتفاع الكامل */
            overflow: hidden; /* إخفاء أشرطة التمرير إذا كانت SVG نفسها تتعامل مع التكبير/التصغير */
            min-width: 0px;
            margin: 0 10px;
            overflow: visible;
            position: relative;
        }
        #nav-thumbs{
            overflow-y: scroll;
            padding: 0 5px;
        }
        .nav-thumb{
            position: relative;
            margin: 10px auto;
        }
        .nav-thumb >p{
            text-align: center;
            font-size: 12px;
            margin: 4px 0 0 0;
        }
        .nav-thumb >div{
            position: relative;
            display: inline-block;
            border: 1px solid #c6cfd5;
        }
        .nav-thumb img{
            display: block;
        }
        #main-content{
            bottom: 0;
            left: 0;
            right: 0;
            /* تم إزالة bottom, left, right حيث أن width/height 100% ستتعامل مع تحديد المواقع */
            background-color: #191919;
            display: flex;
            height: auto;
            width: 100%; /* التأكد من أنها تأخذ العرض الكامل */
            height: 100%; /* التأكد من أنها تأخذ الارتفاع الكامل */
            flex-flow: row wrap;
            text-align:center;

        }
        #svg-container >svg{
            overflow: visible;
            display: block;

        }
        #copyright{
            bottom: 0;
            left: 50%;
            margin: 5px auto;
            font-size: 16px;
            color: #515151;
        }
        #copyright >a{
            text-decoration: none;
            color: #77C;
        }
        .number{
            position: absolute;
            top:0;
            left:0;
            border-top:22px solid #08a1ef;
            border-right: 22px solid transparent;
        }
        .pagenum{
            font-size: 12px;
            color: #fff;
            position: absolute;
            top: -23px;
            left: 2px;
        }
            #navBar::-webkit-scrollbar{
            width: 8px;
            background-color: #f5f5f5;
        }
            #navBar::-webkit-scrollbar-track{
            -webkit-box-shadow: inset 0 0 4px rgba(0,0,0,.3);
            border-radius: 8px;
            background-color: #fff;
        }
            #navBar::-webkit-scrollbar-thumb{
            border-radius: 8px;
            -webkit-box-shadow: inset 0 0 4px rgba(0,0,0,.3);
            background-color: #6b6b70;
        }
        #navBar::-webkit-scrollbar-thumb:hover{
            background-color: #4a4a4f;
        }
        .map-controls {
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 1000;
          display: flex;
          flex-direction: column;
        }

        .map-controls button {
          background-color: #fff;
          border: 1px solid #ccc;
          border-radius: 4px;
          width: 30px;
          height: 30px;
          margin-bottom: 5px;
          cursor: pointer;
          font-size: 18px;
          line-height: 1;
        }

        .map-controls button:hover {
          background-color: #f0f0f0;
        }
        #main-area {
            width: 100%;
            height: 100%;
        }
</style>
